[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omsipmxtool"
version = "0.4"
description = "Experimental cross-platform PMX to OpenOMSI character converter"
license = "AGPL-3.0-only AND GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*", "THIRD-PARTY-NOTICES.txt"]
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "pypinyin>=0.55,<0.56"]

[project.optional-dependencies]
gui = [
    "PySide6>=6.8,<7; sys_platform != 'linux' or python_version >= '3.12'",
    # The 6.12.0 Linux wheel consumes None references on pre-3.12 CPython.
    # Reproducer: actions/runs/39309363550 (100 QColor calls, delta=-100).
    "PySide6>=6.8,<7,!=6.12.0; sys_platform == 'linux' and python_version < '3.12'",
]

[project.gui-scripts]
omsipmxtool-gui = "omsimod.gui:main"
omsimod-gui = "omsimod.gui:main"

[project.scripts]
omsipmxtool = "omsimod.__main__:main"
omsimod = "omsimod.__main__:main"

[tool.setuptools.packages.find]
include = ["omsimod*"]

[tool.setuptools.package-data]
omsimod = ["MODEL-RIGHTS.txt"]
