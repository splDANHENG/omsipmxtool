[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omsimod"
version = "0.2.0"
description = "Experimental cross-platform PMX to OpenOMSI character converter"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]

[project.gui-scripts]
omsimod-gui = "omsimod.gui:main"

[project.scripts]
omsimod = "omsimod.__main__:main"

[tool.setuptools.packages.find]
include = ["omsimod*"]
