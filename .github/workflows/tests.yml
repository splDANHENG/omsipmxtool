name: Cross-platform tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0
      - run: python -m pip install ".[gui]"
      - name: Verify Qt runtime
        run: python -c "from PySide6.QtWidgets import QApplication; import omsimod.gui; app = QApplication([]); print('Qt runtime ready')"
      - run: python -m unittest discover -s tests -v
      - run: python -m omsimod --help
